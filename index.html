<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio Hub</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
        }
        .links-container {
            display: flex;
            gap: 20px;
            justify-content: center;
        }
        .site-link {
            display: inline-block;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: transform 0.2s, background-color 0.2s;
        }
        /* Style for Website 1 */
        .site-one {
            background-color: #0076ff;
        }
        .site-one:hover {
            background-color: #0056b3;
            transform: translateY(-2px);
        }
        /* Style for Website 2 */
        .site-two {
            background-color: #28a745;
        }
        .site-two:hover {
            background-color: #1e7e34;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome to My Projects</h1>
        <div class="links-container">
            <!-- Relative links to your subfolders -->
            <a href="./Multi_shell/" class="site-link site-one">Visit multi shell adaptive solution </a>
            <a href="./Single_Shell/" class="site-link site-two">Visit single shell adaptive solution</a>
        </div>
    </div>

</body>
</html>
