<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Projects Hub</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            /* Sets the starry sky image as a fixed, fullscreen background */
            background: url('./sky.jpg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Glassmorphism panel to make content pop over the dark stars */
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 40px 60px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #ffffff;
            margin-bottom: 35px;
            font-size: 28px;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .links-container {
            display: flex;
            gap: 24px;
            justify-content: center;
        }

        .site-link {
            display: inline-block;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        /* Neon Cyan Accent for Site 1 */
        .site-one {
            background-color: #00bcd4;
        }
        .site-one:hover {
            background-color: #00acc1;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 188, 212, 0.4);
        }

        /* Neon Purple Accent for Site 2 */
        .site-two {
            background-color: #9c27b0;
        }
        .site-two:hover {
            background-color: #8e24aa;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(156, 39, 176, 0.4);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Constellation Design Simulations</h1>
        <div class="links-container">
            <!-- Relative links to your subfolders -->
            <a href="./Multi_shell/" class="site-link site-one">Visit multi shell adaptive solution </a>
            <a href="./Single_Shell/" class="site-link site-two">Visit single shell adaptive solution</a>
        </div>
    </div>

</body>
</html>
